[package]
name = "pipeline_tfhe_rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
diagnostic-trace = []

[dependencies]
tfhe = { version = "0.11", features = ["integer"] }
rayon = "1"
bincode = "1"
dyn-stack = "0.11"
aligned-vec = "0.6"
sha2 = "0.10"

[profile.release]
opt-level = 3

[[bin]]
name = "varco_demo"
path = "src/bin/varco_demo.rs"
