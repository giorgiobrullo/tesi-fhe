services:
  server:
    build:
      context: ../..
      dockerfile: demo/server/Dockerfile
    env_file: ../../demo/config.env
    networks: [varco]

  client:
    build:
      context: ../..
      dockerfile: demo/client/Dockerfile
    depends_on: [server]
    environment:
      VARCO_SERVER: http://server:9000
    volumes:
      - ../../datasets/digiface/estratto:/app/datasets/digiface/estratto:ro
      - "${A29_MODEL_CACHE:?A29_MODEL_CACHE required}:/root/.insightface:ro"
      - chiavi:/app/chiavi
    networks: [varco]
    ports:
      - "127.0.0.1:18080:8000"

networks:
  varco:

volumes:
  chiavi:
