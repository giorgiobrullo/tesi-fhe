[package]
name = "a133_a126_runtime_noise_witness"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []
diagnostic-trace = []

[dependencies]
tfhe = { version = "0.11", features = ["integer"] }
rayon = "1"
bincode = "1"
dyn-stack = "0.11"
aligned-vec = "0.6"
sha2 = "0.10"
serde_json = "=1.0.150"

[profile.release]
opt-level = 3

[[bin]]
name = "a133_a126_runtime_noise_witness"
path = "src/bin/a133_a126_runtime_noise_witness.rs"
required-features = ["diagnostic-trace"]
