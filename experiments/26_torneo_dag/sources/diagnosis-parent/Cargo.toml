[package]
name = "tetris_composite_20260908"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["core"]
resolver = "2"

[features]
default = []
qualified-parent = []
opt-owned-pfks = ["fast/opt-owned-pfks"]
opt-lut-cache = ["fast/opt-lut-cache"]

[dependencies]
libc = "=0.2.189"
fast = { package = "fast_core_mixed_20260906", path = "./core" }
tfhe = { version = "=1.7.0", features = ["integer"] }
rayon = "1"
bincode = "=1.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
