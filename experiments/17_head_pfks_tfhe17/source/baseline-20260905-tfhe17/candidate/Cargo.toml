[package]
name = "baseline_20260905_tfhe17"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []
diagnostic-trace = []

[dependencies]
tfhe = { version = "=1.7.0", features = ["integer"] }
rayon = "1"
bincode = "1"
dyn-stack = "0.13"
aligned-vec = "0.6"
sha2 = "0.10"
serde_json = "=1.0.150"

[profile.release]
opt-level = 3

[[bin]]
name = "baseline_20260905_tfhe17_pair_pilot"
path = "src/main.rs"
