<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varco</title>
<style>
  :root{ --testo:#1c1c1a; --tenue:#8a8a84; --linea:#dedcd7; --si:#2f6b5e; --no:#a04030; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#f3f2ef;color:var(--testo);display:flex;align-items:center;
       justify-content:center;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  main{width:340px;text-align:center}
  .vetro{width:340px;height:340px;border-radius:3px;overflow:hidden;background:#e6e4df;position:relative}
  video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
  .vetro.scatto::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .22s ease-out}
  @keyframes flash{from{opacity:.85}to{opacity:0}}
  .azione{margin-top:22px}
  button{background:none;border:1px solid var(--linea);border-radius:2px;padding:10px 22px;font:inherit;
         font-size:14px;color:var(--testo);cursor:pointer;letter-spacing:.2px}
  button:hover:not(:disabled){border-color:#b9b6ae}
  button:disabled{color:var(--tenue);cursor:default}
  .esito{margin-top:26px;min-height:52px}
  .esito b{display:block;font-size:19px;font-weight:500;letter-spacing:.3px}
  .esito span{display:block;font-size:13px;color:var(--tenue);margin-top:3px}
  .si b{color:var(--si)} .no b{color:var(--no)}
  .nota{margin-top:30px;font-size:11.5px;color:var(--tenue);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        letter-spacing:-.1px;min-height:16px}
  .altro{margin-top:34px;font-size:12px;color:var(--tenue)}
  .altro a{color:var(--tenue);text-decoration:none;border-bottom:1px solid var(--linea);cursor:pointer;
           padding-bottom:1px;margin:0 7px}
  .altro a:hover{color:var(--testo)}
  input{border:0;border-bottom:1px solid var(--linea);background:none;font:inherit;font-size:12px;
        width:76px;text-align:center;color:var(--testo);padding:1px 0}
  input:focus{outline:none;border-color:#b9b6ae}
</style>
</head>
<body>
<main>
  <div class="vetro" id="vetro"><video id="video" autoplay playsinline muted></video></div>

  <div class="azione"><button id="apri">Apri il varco</button></div>

  <div class="esito" id="esito"></div>
  <div class="nota" id="nota"></div>

  <div class="altro">
    <a id="registra">registrami come</a><input id="nome" value="io">
    <a id="popola">popola galleria</a>
    <a id="senza">senza telecamera</a>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let CFG = null;

navigator.mediaDevices?.getUserMedia({video:{width:640,height:480}})
  .then(s => $("#video").srcObject = s)
  .catch(() => nota("telecamera non disponibile — usa «senza telecamera»"));

const nota = t => $("#nota").textContent = t;
function esito(classe, titolo, sotto=""){
  $("#esito").className = "esito " + classe;
  $("#esito").innerHTML = `<b>${titolo}</b>${sotto ? `<span>${sotto}</span>` : ""}`;
}

function scatta(){
  const v = $("#video"), c = document.createElement("canvas");
  c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.92);
}
async function raffica(n){                 // la raffica: è la fusione multi-frame
  const f = [];
  for (let i = 0; i < n; i++){
    f.push(scatta());
    $("#vetro").classList.add("scatto");
    setTimeout(() => $("#vetro").classList.remove("scatto"), 220);
    await new Promise(r => setTimeout(r, 240));
  }
  return f;
}

async function api(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                               body: JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok) throw new Error(j.errore || "errore");
  return j;
}

async function stato(){
  try{
    const s = await (await fetch("/api/stato")).json();
    CFG = s.client.config;
    if (!$("#esito").textContent) nota(`${s.server.iscritti} iscritti in galleria`);
  }catch(e){ nota("server non raggiungibile"); }
}

function mostra(r){
  const t = r.tempi_ms, tot = t.embedding + t.cifratura + t.rete_e_server + t.decifratura;
  if (r.esito === "aperto") esito("si", "Aperto", r.identita);
  else if (r.esito === "negato") esito("no", "Negato", "nessun iscritto riconosciuto");
  else esito("no", "Ambiguo", `${r.conteggio} iscritti sotto soglia`);
  nota(`${Math.round(tot)} ms · il server ha visto ${(r.byte.probe_cifrato/1024).toFixed(0)} KB cifrati `
     + `· ${r.pbs} confronti sul cifrato in ${Math.round(t.server)} ms`);
}

async function con(testo, fn){
  document.querySelectorAll("button,a").forEach(b => b.style.pointerEvents = "none");
  $("#apri").disabled = true;
  esito("", testo); nota("");
  try{ await fn(); }
  catch(e){ esito("no", "Errore", e.message); }
  finally{ document.querySelectorAll("button,a").forEach(b => b.style.pointerEvents = ""); $("#apri").disabled = false; }
}

$("#apri").onclick = () => con("…", async () => mostra(await api("/api/verifica", {frames: await raffica(CFG.k_probe)})));
$("#senza").onclick = () => con("…", async () => mostra(await api("/api/verifica", {sintetico: Math.floor(Math.random()*20)})));
$("#registra").onclick = () => con("…", async () => {
  const r = await api("/api/iscrivi", {frames: await raffica(CFG.k_galleria), nome: $("#nome").value});
  esito("", "Registrato", $("#nome").value);
  nota(`${r.frame} foto fuse in un template · in chiaro sul server, è la sua galleria`);
});
$("#popola").onclick = () => con("…", async () => {
  const r = await api("/api/precarica");
  esito("", "Galleria pronta", `${r.iscritti} iscritti`);
  nota(`volti sintetici · ${r.secondi}s`);
});

stato(); setInterval(stato, 8000);
</script>
</body>
</html>
