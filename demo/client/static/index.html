<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varco</title>
<style>
  :root{ --testo:#111; --tenue:#8c8c8c; --linea:#e4e4e4; --si:#15803d; --no:#b91c1c; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#fff;color:var(--testo);display:flex;align-items:center;
       justify-content:center;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
       -webkit-font-smoothing:antialiased}
  main{width:340px;text-align:center}
  .avviso{display:none;margin:0 0 12px;padding:8px 10px;border:1px solid #fecaca;background:#fff7f7;
          color:#991b1b;font-size:11px;line-height:1.35;text-align:left}
  .vetro{width:340px;height:340px;overflow:hidden;background:#f2f2f2;border:1px solid var(--linea);position:relative}
  video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
  .vetro.scatto::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .2s ease-out}
  @keyframes flash{from{opacity:.9}to{opacity:0}}
  .azione{margin-top:20px}
  button{background:var(--testo);border:0;color:#fff;padding:12px 30px;font:inherit;font-size:14px;
         cursor:pointer;letter-spacing:.15px}
  button:hover:not(:disabled){background:#333}
  button:disabled{background:#c9c9c9;cursor:default}
  .esito{margin-top:28px;min-height:50px}
  .esito b{font-size:20px;font-weight:500;letter-spacing:.2px}
  .esito b::before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;
                   vertical-align:2px;background:transparent}
  .si b::before{background:var(--si)} .no b::before{background:var(--no)}
  .esito span{display:block;font-size:13px;color:var(--tenue);margin-top:5px}
  .nota{margin-top:26px;font-size:11px;color:#a3a3a3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
        min-height:15px}
  .altro{margin-top:38px;font-size:12px;color:var(--tenue)}
  .altro a{color:var(--tenue);text-decoration:none;cursor:pointer;margin:0 8px}
  .altro a:hover{color:var(--testo);text-decoration:underline;text-underline-offset:3px}
  input{border:0;border-bottom:1px solid var(--linea);background:none;font:inherit;font-size:12px;
        width:70px;text-align:center;color:var(--testo);padding:1px 0}
  input:focus{outline:none;border-color:#999}
</style>
</head>
<body>
<main>
  <div class="avviso" id="avviso"></div>
  <div class="vetro" id="vetro"><video id="video" autoplay playsinline muted></video></div>

  <div class="azione"><button id="apri">Apri il varco</button></div>

  <div class="esito" id="esito"></div>
  <div class="nota" id="nota"></div>

  <div class="altro">
    <a id="registra">registrami come</a><input id="nome" value="io">
    <a id="popola">popola galleria</a>
    <a id="senza">senza telecamera</a>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let CFG = null;

navigator.mediaDevices?.getUserMedia({video:{width:640,height:480}})
  .then(s => $("#video").srcObject = s)
  .catch(() => nota("Telecamera non disponibile. Usa «senza telecamera»."));

const nota = t => $("#nota").textContent = t;
function esito(classe, titolo, sotto=""){
  const contenitore = $("#esito"), intestazione = document.createElement("b");
  contenitore.className = "esito " + classe;
  intestazione.textContent = titolo;
  contenitore.replaceChildren(intestazione);
  if (sotto) {
    const dettaglio = document.createElement("span");
    dettaglio.textContent = sotto;
    contenitore.appendChild(dettaglio);
  }
}

function scatta(){
  const v = $("#video"), c = document.createElement("canvas");
  c.width = v.videoWidth || 640; c.height = v.videoHeight || 480;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.92);
}
async function raffica(n){                 // la raffica: è la fusione multi-frame
  const f = [];
  for (let i = 0; i < n; i++){
    f.push(scatta());
    $("#vetro").classList.add("scatto");
    setTimeout(() => $("#vetro").classList.remove("scatto"), 220);
    await new Promise(r => setTimeout(r, 240));
  }
  return f;
}

async function api(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                               body: JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok) throw new Error(j.errore || "errore");
  return j;
}

async function stato(){
  try{
    const s = await (await fetch("/api/stato")).json();
    CFG = s.client.config;
    if (CFG.comparatore_fhe?.stato === "argmin_esatto_bucket_bits_dual_glwe") {
      $("#avviso").style.display = "block";
      $("#avviso").textContent = "Argmin cifrato esatto validato nei test: restituisce l’identità solo se il vincitore supera la propria soglia. Prototipo sperimentale: la probabilità di fallimento composta non ha ancora un limite formale.";
    } else if (CFG.comparatore_fhe?.stato !== "validato") {
      $("#avviso").style.display = "block";
      $("#avviso").textContent = "Prototipo sperimentale: lo stato del confronto FHE non è validato.";
    }
    if (!$("#esito").textContent) nota(`${s.server.iscritti} iscritti in galleria`);
  }catch(e){ nota("server non raggiungibile"); }
}

function mostra(r){
  const t = r.tempi_ms, tot = t.endpoint;
  if (r.esito === "aperto") esito("si", "Aperto", r.identita);
  else esito("no", "Negato", "identità non rilasciata");
  nota(`${Math.round(tot)} ms · il server ha visto ${(r.byte.probe_cifrato/1024).toFixed(0)} KB cifrati `
     + `· ${r.pbs} PBS sul cifrato in ${Math.round(t.server)} ms`);
}

async function con(testo, fn){
  document.querySelectorAll("button,a").forEach(b => b.style.pointerEvents = "none");
  $("#apri").disabled = true;
  esito("", testo); nota("");
  try{ await fn(); }
  catch(e){ esito("no", "Errore", e.message); }
  finally{ document.querySelectorAll("button,a").forEach(b => b.style.pointerEvents = ""); $("#apri").disabled = false; }
}

$("#apri").onclick = () => con("…", async () => mostra(await api("/api/verifica", {frames: await raffica(CFG.k_probe)})));
$("#senza").onclick = () => con("…", async () => mostra(await api("/api/verifica", {sintetico: Math.floor(Math.random()*20)})));
$("#registra").onclick = () => con("…", async () => {
  const r = await api("/api/iscrivi", {frames: await raffica(CFG.k_galleria), nome: $("#nome").value});
  esito("", "Registrato", $("#nome").value);
  nota(`${r.frame} foto fuse in un template · in chiaro sul server, è la sua galleria`);
});
$("#popola").onclick = () => con("…", async () => {
  const r = await api("/api/precarica");
  esito("", "Galleria pronta", `${r.iscritti} iscritti`);
  nota(`volti sintetici · ${r.secondi}s`);
});

stato(); setInterval(stato, 8000);
</script>
</body>
</html>
