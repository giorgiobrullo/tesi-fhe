[package]
name = "a28_web_worker"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[features]
default = []
diagnostic-trace = []

[dependencies]
tfhe = { version = "=0.11.3", features = ["integer"] }
rayon = "1"
bincode = "1"
dyn-stack = "0.11"
aligned-vec = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 16
lto = false

[[bin]]
name = "a28_web_worker"
path = "src/main.rs"
