[project]
name = "tesi-fhe"
version = "0.1.0"
description = "Identificazione facciale con query cifrata: demo TFHE ed esperimenti di crittografia omomorfica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "concrete-python>=2.11.0",
    "fastapi>=0.141.1",
    "insightface>=1.0.1",
    "matplotlib>=3.10.9",
    "numpy>=1.26.4",
    "onnxruntime>=1.27.0",
    "python-multipart>=0.0.32",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "tenseal>=0.3.17",
    "uvicorn>=0.52.4",
]

[tool.basedpyright]
# Controlli standard; alcune librerie scientifiche hanno stub incompleti.
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# Queste diagnostiche sono disabilitate per le annotazioni ampie delle API
# Concrete. I test verificano separatamente i valori restituiti dai circuiti.
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportArgumentType = false
